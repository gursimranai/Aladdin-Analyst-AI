
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "aladdin-analyst-ai"
version = "0.1.0"
description = "A hybrid intelligent data analysis and automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gursimran Singh" },
]

dependencies = [
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/gursimranai/Aladdin-Analyst-AI"
Repository = "https://github.com/gursimranai/Aladdin-Analyst-AI"
Issues = "https://github.com/gursimranai/Aladdin-Analyst-AI/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

excel = [
    "openpyxl>=3.1",
]

parquet = [
    "pyarrow>=15.0",
]

visualization = [
    "matplotlib>=3.9",
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

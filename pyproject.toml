
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "aladdin-analyst-ai"
version = "0.1.0"
description = "A hybrid intelligent data analysis and automation platform."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

excel = [
    "openpyxl>=3.1",
]

parquet = [
    "pyarrow>=15.0",
]

visualization = [
    "matplotlib>=3.9",
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
